[project]
name = "ragkit"
version = "0.1.0"
description = "通用 RAG 工具包：文件解析 → 清洗切分 → 向量化 → Milvus 索引 → 检索（稠密/混合/重排）→ 评估"
license = { text = "MIT" }
keywords = ["rag", "retrieval", "milvus", "embedding", "rerank", "bm25", "asyncio"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
readme = "README.md"
authors = [
    { name = "ZhaoShiGuang", email = "123456789@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
ragkit = "ragkit.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"        # 以后写 async def test_xxx 不用再加 @pytest.mark.asyncio

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 100
target-version = "py311"

# examples/eng_docs 是**语料**，不是代码。
#
# 它里面的 .md 来自 LangChain 官方仓库、逐字未改，而代码块里的 Python
# 并不符合本项目的排版规则 —— 不加这条排除的话，`ruff format .`
# （README 的开发命令）会把那些代码块重新排版：
#   * 语料一改，`chunk_id` 全变，评估集里绑在 chunk_id 上的标注全部失效；
#   * 也让 examples/eng_docs/README.md 里「内容未改动」那句话变成假的。
# 数据就是数据，别让格式化工具去动它。
extend-exclude = ["examples/eng_docs"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]   # E/F 基础错误、I 导入排序、UP 语法现代化、B/SIM 常见坑

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true   # 逼你写类型注解，RAG 这种多模块项目非常值
ignore_missing_imports = true
