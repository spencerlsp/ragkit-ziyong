[project]
name = "ragkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ZhaoShiGuang", email = "123456789@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"        # 以后写 async def test_xxx 不用再加 @pytest.mark.asyncio

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]   # E/F 基础错误、I 导入排序、UP 语法现代化、B/SIM 常见坑

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true   # 逼你写类型注解，RAG 这种多模块项目非常值
ignore_missing_imports = true
